global:
  scrape_interval: 15s
scrape_configs:
  - job_name: skymate-backend
    metrics_path: /metrics
    static_configs:
      - targets: ['backend.skymate.svc.cluster.local:4000']
  - job_name: skymate-ai
    metrics_path: /metrics
    static_configs:
      - targets: ['ai-service.skymate.svc.cluster.local:8000']
