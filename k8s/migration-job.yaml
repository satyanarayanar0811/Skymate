apiVersion: batch/v1
kind: Job
metadata: {name: skymate-db-migration, namespace: skymate}
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: mysql:8.4
          command:
            - sh
            - -c
            - >-
              mysql --host="$MYSQL_HOST" --user=root --password="$MYSQL_ROOT_PASSWORD" "$MYSQL_DATABASE" < /migrations/001_initial_schema.sql &&
              mysql --host="$MYSQL_HOST" --user=root --password="$MYSQL_ROOT_PASSWORD" "$MYSQL_DATABASE" < /migrations/002_phase_extensions.sql
          envFrom: [{configMapRef: {name: skymate-config}}, {secretRef: {name: skymate-secrets}}]
          volumeMounts: [{name: migrations, mountPath: /migrations, readOnly: true}]
      volumes: [{name: migrations, configMap: {name: skymate-migrations}}]
