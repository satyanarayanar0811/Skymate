apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: skymate
  namespace: skymate
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - skymate.example.com
        - api.skymate.example.com
      secretName: skymate-tls
  rules:
    - host: skymate.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
    - host: api.skymate.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 4000
