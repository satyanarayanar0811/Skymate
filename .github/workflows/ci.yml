name: SkyMate CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root-test-password
          MYSQL_DATABASE: airline
          MYSQL_USER: airline
          MYSQL_PASSWORD: airline-test-password
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot-test-password --silent"
          --health-interval=10s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20', cache: npm, cache-dependency-path: backend/package.json}
      - name: Install backend dependencies
        working-directory: backend
        run: npm install --no-audit --no-fund
      - name: Backend tests
        working-directory: backend
        run: npm test
      - name: Type check and build backend
        working-directory: backend
        run: npm run build
      - name: npm audit
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20', cache: npm, cache-dependency-path: frontend/package.json}
      - name: Build frontend
        working-directory: frontend
        run: npm install --no-audit --no-fund && npm run build
  python-agent:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install and test agent
        working-directory: ai-service
        run: pip install -r requirements.txt pytest pip-audit && pytest
      - name: Dependency audit
        working-directory: ai-service
        run: pip-audit -r requirements.txt
  container-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        run: docker build -t skymate-backend:ci ./backend
      - name: Build frontend image
        run: docker build --build-arg NEXT_PUBLIC_API_URL=http://localhost:4000/api -t skymate-frontend:ci ./frontend
      - name: Build AI image
        run: docker build -t skymate-ai:ci ./ai-service
